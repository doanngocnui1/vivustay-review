<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng về Vie Stay...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFBF7;
            color: #1C1917;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #FED7AA;
            border-top: 4px solid #FF6500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px; color: #FF6500; }
        p { color: #78716C; font-size: 15px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Đăng nhập thành công!</h2>
    <p>Đang quay trở lại ứng dụng Vie Stay...</p>

    <script>
        // Forward params to deep link
        var search = window.location.search;
        var hash = window.location.hash;
        var deepLink = "viestay://oauthredirect" + search + hash;
        
        // Attempt deep link
        window.location.href = deepLink;
        
        // Fallback button if deep link didn't trigger automatically
        setTimeout(function() {
            var btn = document.createElement('a');
            btn.href = deepLink;
            btn.innerText = "Bấm vào đây để mở ứng dụng";
            btn.style.cssText = "display:inline-block; margin-top:20px; padding:12px 24px; background:#FF6500; color:#fff; text-decoration:none; border-radius:12px; font-weight:bold;";
            document.body.appendChild(btn);
        }, 1500);
    </script>
</body>
</html>
