<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng về Vie Stay...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFBF7;
            color: #1C1917;
            text-align: center;
            padding: 24px;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid #FED7AA;
            border-top: 4px solid #FF6500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px; color: #FF6500; font-size: 24px; }
        p { color: #78716C; font-size: 15px; max-width: 320px; line-height: 1.5; }
        .btn-open {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 28px;
            background: #FF6500;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(255, 101, 0, 0.35);
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Đăng nhập thành công!</h2>
    <p id="msg">Đang tự động chuyển về ứng dụng Vie Stay...</p>

    <script>
        (function() {
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            
            // Parse both query parameters and hash fragment
            var searchParams = new URLSearchParams(search.startsWith('?') ? search.substring(1) : search);
            var hashParams = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);
            
            // Extract state or fallback to viestay scheme
            var stateParam = searchParams.get('state') || hashParams.get('state');
            var targetScheme = "viestay://oauthredirect";

            if (stateParam) {
                try {
                    var decodedState = decodeURIComponent(stateParam);
                    if (decodedState.indexOf('://') !== -1) {
                        targetScheme = decodedState;
                    }
                } catch(e) {}
            }

            // Collect all parameters (search + hash) to forward to app
            var combinedParams = [];
            
            searchParams.forEach(function(val, key) {
                combinedParams.push(encodeURIComponent(key) + '=' + encodeURIComponent(val));
            });
            
            hashParams.forEach(function(val, key) {
                combinedParams.push(encodeURIComponent(key) + '=' + encodeURIComponent(val));
            });

            var queryString = combinedParams.join('&');
            var separator = targetScheme.indexOf('?') === -1 ? '?' : '&';
            if (targetScheme.indexOf('#') !== -1) {
                separator = '&';
            }
            
            var finalUrl = queryString ? (targetScheme + separator + queryString) : targetScheme;

            // Attempt immediate redirect
            try {
                window.location.replace(finalUrl);
            } catch(err) {
                window.location.href = finalUrl;
            }

            // Render clickable button after 400ms in case browser blocks auto-redirect
            setTimeout(function() {
                var btn = document.createElement('a');
                btn.className = 'btn-open';
                btn.href = finalUrl;
                btn.innerText = '👉 Bấm vào đây để mở ứng dụng Vie Stay';
                document.body.appendChild(btn);
            }, 400);
        })();
    </script>
</body>
</html>
